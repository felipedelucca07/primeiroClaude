<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Loja{% endblock %} · Minha Loja</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <div class="container topo-linha">
      <a class="marca" href="{{ url_for('index') }}" aria-label="Minha Loja - início">
        <span class="marca-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2ZM7.2 14.8h9.9c.8 0 1.4-.4 1.7-1.1L22 6H5.2l-.9-2H1v2h2l3.6 7.6-1.4 2.4C4.5 17.3 5.5 19 7 19h12v-2H7l1.1-2.2Z"/></svg>
        </span>
        <span class="marca-texto">Minha<strong>Loja</strong></span>
      </a>

      <form class="busca" method="get" action="{{ url_for('index') }}" role="search">
        <input type="search" name="q" id="busca" value="{{ request.args.get('q', '') }}"
               placeholder="Buscar produtos…" autocomplete="off" aria-label="Buscar produtos">
        <button type="submit" class="busca-botao" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.2-1.6l.3.3v.8l5 5 1.5-1.5-5-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
        </button>
      </form>
    </div>

    <nav class="container topo-nav">
      <a href="{{ url_for('index') }}" class="{{ 'ativo' if request.endpoint == 'index' }}">Produtos</a>
      <a href="{{ url_for('novo') }}" class="{{ 'ativo' if request.endpoint == 'novo' }}">Vender um produto</a>
    </nav>
  </header>

  <main class="container">
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="rodape">
    <div class="container">Minha Loja · CRUD com Flask e SQLite</div>
  </footer>

  <div class="avisos" aria-live="polite">
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="aviso aviso-{{ categoria }}" role="status">
        <span class="aviso-icone" aria-hidden="true">✓</span>
        <span>{{ mensagem }}</span>
        <button type="button" class="aviso-fechar" aria-label="Fechar">×</button>
      </div>
    {% endfor %}
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
