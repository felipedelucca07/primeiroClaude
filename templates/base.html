<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Loja{% endblock %} · Loja</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <div class="container topo-conteudo">
      <a class="marca" href="{{ url_for('index') }}">
        <span class="marca-icone">◆</span> Minha Loja
      </a>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'ativo' if request.endpoint == 'index' }}">Produtos</a>
        <a href="{{ url_for('novo') }}" class="botao botao-primario">+ Novo produto</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="avisos">
      {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
        <div class="aviso aviso-{{ categoria }}" role="status">
          <span>{{ mensagem }}</span>
          <button type="button" class="aviso-fechar" aria-label="Fechar">×</button>
        </div>
      {% endfor %}
    </div>

    {% block conteudo %}{% endblock %}
  </main>

  <footer class="rodape container">Minha Loja · CRUD com Flask e SQLite</footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
